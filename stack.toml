[meta]
schema_version = "1"
created = "2026-05-10T00:00:00Z"
last_validated = ""

[runtime]
primary_os = "auto"
package_manager = "pnpm"
python_manager = "uv"
default_caveman_level = "full"

[base_tools]
superpowers = { source = "marketplace", id = "superpowers@claude-plugins-official", prereqs = ["claude-cli"] }
frontend_design = { source = "marketplace", id = "frontend-design@claude-plugins-official", prereqs = ["claude-cli"] }
grill_with_docs = { source = "github", repo = "mattpocock/skills", path = "skills/engineering/grill-with-docs", prereqs = ["git"] }
diagnose = { source = "github", repo = "mattpocock/skills", path = "skills/engineering/diagnose", prereqs = ["git"] }
git_guardrails = { source = "github", repo = "mattpocock/skills", path = "skills/misc/git-guardrails-claude-code", prereqs = ["git"] }

[global_tools]
cocoindex_code = { source = "uv_tool", package = "cocoindex-code", extras = "full", prereqs = ["python", "uv"] }
mempalace = { source = "uv_tool", package = "mempalace", prereqs = ["python", "uv"] }
playwright = { source = "npm", package = "@playwright/mcp", prereqs = ["node", "pnpm"] }
graphify = { source = "uv_tool", package = "graphifyy", prereqs = ["python", "uv"], optional = true }

[mcp_servers]
context7 = { source = "npm", package = "@upstash/context7-mcp", prereqs = ["node", "pnpm"] }
tolaria = { source = "desktop", note = "Manual install from https://github.com/refactoringhq/tolaria/releases — after install, configure MCP path below", prereqs = [] }


[security]
allowlisted_domains = [
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
    "github.com",
    "objects.githubusercontent.com",
    "anthropic.com",
    "claude.com",
    "raw.githubusercontent.com",
    "api.github.com",
]
require_checksum_for_binaries = true
