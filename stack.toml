[meta]
schema_version = "1"
created = "2026-05-10T00:00:00Z"
last_validated = ""

[runtime]
primary_os = "auto"
package_manager = "pnpm"
python_manager = "uv"
default_caveman_level = "full"

# platforms: "claude-code" = Claude Code only, "opencode" = OpenCode only, "all" = both
# skills without platforms field default to "all"

[base_tools]
superpowers     = { source = "marketplace", id = "superpowers@claude-plugins-official",     prereqs = ["claude-cli"], platforms = ["claude-code"] }
frontend_design = { source = "marketplace", id = "frontend-design@claude-plugins-official", prereqs = ["claude-cli"], platforms = ["claude-code"] }
claude_hud      = { source = "marketplace", id = "claude-hud@claude-hud", marketplace_repo = "jarrodwatts/claude-hud", prereqs = ["claude-cli"], platforms = ["claude-code"] }
grill_with_docs = { source = "github", repo = "mattpocock/skills", path = "skills/engineering/grill-with-docs",        prereqs = ["git"],        platforms = ["all"] }
diagnose        = { source = "github", repo = "mattpocock/skills", path = "skills/engineering/diagnose",               prereqs = ["git"],        platforms = ["all"] }
git_guardrails  = { source = "github", repo = "mattpocock/skills", path = "skills/misc/git-guardrails-claude-code",    prereqs = ["git"],        platforms = ["all"] }

[global_tools]
cocoindex_code = { source = "uv_tool", package = "cocoindex-code", extras = "full", prereqs = ["python", "uv"],         platforms = ["all"] }
playwright     = { source = "npm",     package = "@playwright/mcp",                 prereqs = ["node", "pnpm"],         platforms = ["all"] }
# mem0: MCP server via uv run (mem0ai + LiteLLM + FastEmbed). Needs OPENROUTER_API_KEY. See MEM0_SETUP.md.
mem0           = { source = "script",  script = "scripts/mem0_server.py",           prereqs = ["python", "uv"],           platforms = ["all"] }

[mcp_servers]
context7 = { source = "npm", package = "@upstash/context7-mcp", prereqs = ["node", "pnpm"], platforms = ["all"] }

[security]
allowlisted_domains = [
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
    "github.com",
    "objects.githubusercontent.com",
    "anthropic.com",
    "claude.com",
    "raw.githubusercontent.com",
    "api.github.com",
]
require_checksum_for_binaries = true
